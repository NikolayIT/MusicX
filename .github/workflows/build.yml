name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            5.0.x

      - name: Restore
        run: dotnet restore src/MusicX.sln

      - name: Build
        run: dotnet build src/MusicX.sln -c Release --no-restore

      # Only the offline unit tests run in CI. The MusicX.Services.DataProviders
      # tests scrape live third-party pages (Top40Charts, the lyrics plugin) and
      # fail whenever those sites change, which they have.
      - name: Test
        run: >
          dotnet test src/Tests/MusicX.Services.Data.Tests/MusicX.Services.Data.Tests.csproj
          -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
